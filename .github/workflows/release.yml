# `v0.1.0` triggers this workflow (packages and publishes the tuxedo-r
# gem); `dist/v0.1.0` separately triggers dist-release.yml (the binary
# archives on a GitHub Release, see dist-workspace.toml). Cutting a
# release means pushing both tags, same version.
#
# workflow_dispatch with "publish" unchecked builds and uploads the gems
# as an artifact without pushing to RubyGems.org; checking it (or a tag
# push) pushes for real, via RubyGems Trusted Publishing (OIDC).
name: Release gems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built gems to RubyGems.org. Leave unchecked to only build and download the artifact."
        type: boolean
        default: false

jobs:
  check-version:
    name: Check version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml vs ruby/lib/tuxedo/r/version.rb
        run: |
          set -eu
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          gem_version="$(grep -oE '"[0-9][^"]*"' ruby/lib/tuxedo/r/version.rb | tr -d '"')"
          echo "Cargo.toml:  $cargo_version"
          echo "version.rb:  $gem_version"
          if [ "$cargo_version" != "$gem_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and ruby/lib/tuxedo/r/version.rb ($gem_version) disagree."
            exit 1
          fi

      - name: Tag vs Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag:         $GITHUB_REF_NAME"
          echo "Cargo.toml:  $cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and Cargo.toml ($cargo_version) disagree."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    # Every target cross-compiles from one Linux runner with cargo-zigbuild,
    # macOS included: zig links Mach-O without an Apple SDK and gives the
    # arm64 binary the ad-hoc signature Apple Silicon requires. The gnu
    # targets link against glibc 2.28 (the `.2.28` suffix), so the binary
    # runs on Debian 10, Ubuntu 20.04 and RHEL 8, not only on whatever glibc
    # the runner has.
    #
    # Windows builds in build-windows instead: ruby-prism-sys's bindings do
    # not build against zig's Windows headers.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
            gem_platform: x86_64-linux
            run: ""
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
            gem_platform: aarch64-linux
            run: qemu-aarch64 -L /usr/aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
            gem_platform: x86_64-linux-musl
            run: ""
          - target: aarch64-unknown-linux-musl
            zig_target: aarch64-unknown-linux-musl
            gem_platform: aarch64-linux-musl
            run: qemu-aarch64
          - target: aarch64-apple-darwin
            zig_target: aarch64-apple-darwin
            gem_platform: arm64-darwin
            run: none
          - target: x86_64-apple-darwin
            zig_target: x86_64-apple-darwin
            gem_platform: x86_64-darwin
            run: none
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.zig_target }}

      - name: Stage binary
        run: |
          set -eu
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/tuxedo" staging/tuxedo
          chmod +x staging/tuxedo

      - name: Install qemu
        if: startsWith(matrix.run, 'qemu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user libc6-arm64-cross

      # Natively or under qemu; the runner cannot execute a macOS binary.
      - name: Confirm the binary reports the same version
        if: matrix.run != 'none'
        run: |
          set -eu
          reported="$(${{ matrix.run }} staging/tuxedo --version | awk '{print $NF}')"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$reported" != "$cargo_version" ]; then
            echo "::error::staging/tuxedo reports version $reported, Cargo.toml says $cargo_version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tuxedo-${{ matrix.gem_platform }}
          path: staging/

  # The x64-mingw-ucrt gem is what RubyGems resolves for RubyInstaller's
  # Ruby; the binary is a native MSVC build, which needs no MinGW runtime.
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: check-version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binary
        run: |
          set -eu
          mkdir -p staging
          cp target/x86_64-pc-windows-msvc/release/tuxedo.exe staging/tuxedo.exe

      - name: Confirm the binary reports the same version
        run: |
          set -eu
          reported="$(staging/tuxedo.exe --version | tr -d '\r' | awk '{print $NF}')"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$reported" != "$cargo_version" ]; then
            echo "::error::staging/tuxedo.exe reports version $reported, Cargo.toml says $cargo_version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tuxedo-x64-mingw-ucrt
          path: staging/

  package:
    name: Package and publish gems
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    # For rubygems/configure-rubygems-credentials, below.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble platform binaries
        run: |
          set -eu
          cd ruby
          for dir in ../artifacts/tuxedo-*/; do
            platform=$(basename "$dir" | sed 's/^tuxedo-//')
            mkdir -p "exe/$platform"
            cp "$dir"/* "exe/$platform/"
            chmod +x "exe/$platform"/*
          done

      - name: Build gems
        run: |
          cd ruby
          bundle exec rake gem:ruby
          for dir in exe/*/; do
            bundle exec rake "gem:$(basename "$dir")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: ruby/pkg/*.gem

      - name: Configure RubyGems credentials
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push to RubyGems
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        run: |
          set -eu
          for gem in ruby/pkg/*.gem; do
            gem push "$gem"
          done
