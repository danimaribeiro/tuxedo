# `v0.1.0` triggers this workflow (packages and publishes the tuxedo-r
# gem); `dist/v0.1.0` separately triggers dist-release.yml (the binary
# archives on a GitHub Release, see dist-workspace.toml). Cutting a
# release means pushing both tags, same version.
#
# workflow_dispatch with "publish" unchecked builds and uploads the gems
# as an artifact without pushing to RubyGems.org; checking it (or a tag
# push) pushes for real, via RubyGems Trusted Publishing (OIDC).
name: Release gems

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the built gems to RubyGems.org. Leave unchecked to only build and download the artifact."
        type: boolean
        default: false

jobs:
  check-version:
    name: Check version agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml vs ruby/lib/tuxedo/r/version.rb
        run: |
          set -eu
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          gem_version="$(grep -oE '"[0-9][^"]*"' ruby/lib/tuxedo/r/version.rb | tr -d '"')"
          echo "Cargo.toml:  $cargo_version"
          echo "version.rb:  $gem_version"
          if [ "$cargo_version" != "$gem_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and ruby/lib/tuxedo/r/version.rb ($gem_version) disagree."
            exit 1
          fi

      - name: Tag vs Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag:         $GITHUB_REF_NAME"
          echo "Cargo.toml:  $cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and Cargo.toml ($cargo_version) disagree."
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            gem_platform: arm64-darwin
          - target: x86_64-apple-darwin
            os: macos-13
            gem_platform: x86_64-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            gem_platform: x86_64-linux
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            gem_platform: aarch64-linux
            use_cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            gem_platform: x86_64-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            gem_platform: aarch64-linux-musl
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            gem_platform: x64-mingw-ucrt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -eu
          mkdir -p staging
          bin_name=tuxedo
          case "${{ matrix.target }}" in
            *windows*) bin_name=tuxedo.exe ;;
          esac
          cp "target/${{ matrix.target }}/release/$bin_name" "staging/$bin_name"
          chmod +x "staging/$bin_name"

      # Only where the runner can execute what it just built.
      - name: Confirm the binary reports the same version
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: |
          set -eu
          bin="$(find staging -type f)"
          reported="$("$bin" --version | awk '{print $NF}')"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$reported" != "$cargo_version" ]; then
            echo "::error::$bin reports version $reported, Cargo.toml says $cargo_version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tuxedo-${{ matrix.gem_platform }}
          path: staging/

  package:
    name: Package and publish gems
    needs: build
    runs-on: ubuntu-latest
    # For rubygems/configure-rubygems-credentials, below.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ruby

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble platform binaries
        run: |
          set -eu
          cd ruby
          for dir in ../artifacts/tuxedo-*/; do
            platform=$(basename "$dir" | sed 's/^tuxedo-//')
            mkdir -p "exe/$platform"
            cp "$dir"/* "exe/$platform/"
            chmod +x "exe/$platform"/*
          done

      - name: Build gems
        run: |
          cd ruby
          bundle exec rake gem:ruby
          for platform in arm64-darwin x86_64-darwin x86_64-linux aarch64-linux x86_64-linux-musl aarch64-linux-musl x64-mingw-ucrt; do
            bundle exec rake "gem:${platform}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: ruby/pkg/*.gem

      - name: Configure RubyGems credentials
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push to RubyGems
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        run: |
          set -eu
          for gem in ruby/pkg/*.gem; do
            gem push "$gem"
          done
