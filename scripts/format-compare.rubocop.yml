# Rubocop config used only for scripts/format-compare.sh's baseline (see
# that script for how it's invoked). Starts from rubocop's own defaults
# (this file is passed via `-c`, not merged with any project's own
# .rubocop.yml) and additionally disables AllowForAlignment on the cops
# that default it to true.
#
# AllowForAlignment lets a human's manually-aligned columns (extra spaces
# before a `=`, or between a hash rocket and its value, so a run of similar
# lines lines up visually) stand as *not* an offense. Tuxedo collapses
# such runs to one space by design (a hand-aligned column is bracket
# alignment done manually; see CLAUDE.md, "The goal"), so with rubocop's
# default the two outputs would differ on every hand-aligned block for a
# reason that is a choice, not a gap. Turning it off keeps format-compare's
# mismatch count pointed at real differences.
Layout/ExtraSpacing:
  AllowForAlignment: false
Layout/SpaceAroundOperators:
  AllowForAlignment: false
Layout/SpaceBeforeFirstArg:
  AllowForAlignment: false
