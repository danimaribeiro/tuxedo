# Rubocop config used only for scripts/format-verify.sh (see that script).
#
# Unlike scripts/format-compare.rubocop.yml -- which approximates rubocop's
# stock behaviour so the two tools' *output* can be diffed -- this file
# describes the layout Tuxedo is actually aiming for. It is a specification,
# not a baseline: every cop below is set to the style Tuxedo emits, so an
# offense it reports is either a formatter bug or one of the two
# disagreements listed at the end of this comment.
#
# Two properties, both deliberate (CLAUDE.md, "The goal"):
#
#   1. All-or-nothing expansion. A collection either fits on one line or
#      every element gets its own line. Rubocop's defaults bin-pack (fill
#      as many elements per line as the column limit allows), which makes
#      adding or removing one element reflow an arbitrary number of
#      unrelated lines. The six `*LineBreak`/`*LineBreaks` cops below are
#      what forbid packing; all six ship disabled by default.
#
#   2. Block indentation. When a collection, argument list, method chain
#      or keyword value expands, its continuation sits at a fixed indent
#      from the start of the statement -- never aligned under the opening
#      bracket, the receiver, or the keyword. Alignment makes the *name* of
#      the thing control the indentation of everything under it, so
#      renaming a variable reindents the whole literal. Every cop with an
#      "aligned" default is set to its fixed-indent style below.
#
# There is deliberately no trailing comma on the last element: rubocop's
# `Style/TrailingCommaIn*` defaults to `no_comma`, and this file does not
# override it (it is a Style cop anyway, outside the Layout department
# this config is used with).
#
# This config is passed via `-c`, so it starts from rubocop's own defaults
# and ignores whatever .rubocop.yml the project under test ships.
#
# What the number means: rubocop only checks a line break that is *there*.
# It never asks whether Tuxedo should have broken a construct it kept flat,
# so zero offenses is a subset relation ("everything Tuxedo emits, rubocop
# accepts"), not byte equality with rubocop's own autocorrect.
#
# --- The two disagreements that can never reach zero ---
#
# Both follow from property 2, and neither is a bug to fix. Everything
# else this config reports is a formatter bug; those are tracked as GitHub
# issues, not here.
#
# Layout/ElseAlignment, Layout/EndAlignment, Layout/CaseIndentation,
# Layout/BeginEndAlignment, Layout/IndentationWidth (partial):
#   For a keyword used as a value in a position that is *not* a plain
#   assignment (`x << if cond`, `foo(if cond ...)`, `a || begin ... end`),
#   rubocop has no style that puts `else`/`end`/`when` at the statement's
#   indent: even `variable`/`start_of_line` only cover the `x = if` shape.
#   Tuxedo keeps them at a fixed indent from the statement in every
#   position. The `EnforcedStyleAlignWith: variable` / `EnforcedStyle: end`
#   settings below cover the assignment shape, which is most of them.
#
# Layout/LineLength (partial):
#   A single literal wider than the limit (one string, one regex, a comment,
#   `raise "huge message"` with nothing to break after) cannot wrap without
#   inventing a split. Tuxedo does not invent splits. A `#{}` hole is held
#   on one line for the same reason. Every other LineLength hit is a
#   construct Tuxedo does not break yet, and is a bug.

# --- 1. All-or-nothing expansion: no bin-packing ---
Layout/FirstArrayElementLineBreak:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
Layout/MultilineArrayLineBreaks:
  Enabled: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

# --- 2. Block indentation: bracket on its own line, fixed indent ---
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/MultilineArrayBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineHashBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineMethodCallBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineOperationIndentation:
  EnforcedStyle: indented
# `aligned` (the default) wants a broken `.method` chain under the column
# its receiver starts at; `indented` is the fixed indent from the statement.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
# An `if`/`case`/`begin` used as a value keeps its `end`/`when` at the
# statement's own indent, not under the column the opening keyword
# happens to sit at -- same fixed-indent rule as the cops above, applied
# to a keyword instead of a bracket.
Layout/EndAlignment:
  EnforcedStyleAlignWith: variable
Layout/CaseIndentation:
  EnforcedStyle: end
Layout/BeginEndAlignment:
  EnforcedStyleAlignWith: start_of_line

# --- Hand-aligned columns ---
# Tuxedo collapses a run of spaces to one, by design: a column aligned by
# hand is bracket alignment done manually, and every edit to the longest
# entry reindents the rest. These cops default to allowing such runs, so
# they are told not to, or they would never report one Tuxedo left behind.
Layout/ExtraSpacing:
  AllowForAlignment: false
Layout/SpaceAroundOperators:
  AllowForAlignment: false
Layout/SpaceBeforeFirstArg:
  AllowForAlignment: false
