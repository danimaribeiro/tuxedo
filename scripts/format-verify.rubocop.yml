# Rubocop config used only for scripts/format-verify.sh (see that script).
#
# Unlike scripts/format-compare.rubocop.yml — which approximates rubocop's
# stock behaviour so the two tools' *output* can be diffed — this file
# describes the layout Tuxedo is actually aiming for: consistent formatting
# optimized for diff quality. It is a specification, not a baseline.
#
# Two properties, both deliberate:
#
#   1. All-or-nothing expansion. A collection either fits on one line or
#      every element gets its own line. Rubocop's defaults bin-pack (fill
#      as many elements per line as the column limit allows), which makes
#      adding or removing one element reflow an arbitrary number of
#      unrelated lines. The six `*LineBreak`/`*LineBreaks` cops below are
#      what forbid packing; all six ship disabled by default.
#
#   2. Block indentation. When a collection expands, the bracket sits alone
#      on its own line and the elements sit at a fixed indent from the
#      start of the statement — not aligned under the opening bracket.
#      Bracket alignment makes the *name* of the thing control the
#      indentation of every element, so renaming a variable reindents the
#      whole literal.
#
# Note there is deliberately no trailing comma on the last element:
# rubocop's `Style/TrailingCommaIn*` defaults to `no_comma`, and this file
# does not override it (it is a Style cop anyway, outside the Layout
# department this config is used with).
#
# This config is passed via `-c`, so it starts from rubocop's own defaults
# and ignores whatever .rubocop.yml the project under test ships.
#
# --- Known, permanent disagreements ---
#
# Some cops can never reach 0 offenses without abandoning the block-
# indentation spec above. These are not bugs to fix -- don't re-litigate
# them without a real change to the spec itself.
#
# | Cop                                     | Disagreement |
# |------------------------------------------|--------------|
# | Layout/ElseAlignment, Layout/EndAlignment | For an `if`/`case` used as a value (`x = if ...`, `x << if ...`), rubocop's stock default (`EnforcedStyleAlignWith: keyword`, confirmed against this file, which deliberately doesn't override it) wants `else`/`end` aligned under the column the `if` keyword sits at -- e.g. `message << if cond` puts `if` after `message << `, so `else`/`end` must sit there too. That's bracket alignment: the column depends on what precedes the keyword, so renaming `message` reindents the whole value. Tuxedo keeps `else`/`end` at a fixed indent from the statement instead. See `test-projects/thor/lib/thor/actions.rb`'s `message << if source_paths.empty? ... end`. (A project's own `.rubocop.yml` -- thor's included -- may set `EnforcedStyleAlignWith: variable`, which *is* block-indented, but `-c` here bypasses project overrides on purpose.) |
# | Layout/LineLength (partial)               | A bare command call (`raise Foo, "msg" if cond`, no parens) has no clean multi-line continuation in Ruby, and Tuxedo doesn't rewrite bare-command style into a parenthesized call to make room for one (see the note in `write_arg_list`). A monolithic string/regex literal that alone exceeds the limit can't be wrapped without altering its content. Both are permanent: see `test-projects/thor/lib/thor/parser/arguments.rb`'s `raise MalformattedArgumentError, "..." if hash.include? key`. |
# | Layout/MultilineMethodCallIndentation     | Rubocop's stock default is `aligned`: a broken `.method` chain's continuation should align under the column its *base* expression starts at. When the base sits mid-statement (`X unless Thor::Base\n  .subclass_files\n  .keys`), that column depends on what precedes it (`unless `, an assignment, ...), so renaming/moving it reindents the whole chain -- the same bracket-alignment problem as ElseAlignment, just for chains. Tuxedo's chain-breaking (calls.rs's `try_build_chain_doc`) always indents one fixed level from the statement instead. See `test-projects/thor/lib/thor/runner.rb:227`. |
#
# --- Known gaps (missing features, not spec conflicts -- worth fixing) ---
#
# | Gap | Notes |
# |-----|-------|
# | `&&`/`\|\|` chains still bin-pack | `fmt_and_node`/`fmt_or_node` (control_flow.rs) now wrap a single `a && b` pair via `fmt_binary_bool_node`, same Doc-group pattern as the operator-style call path in calls.rs. A chain of same-precedence ops (`a && b && c`) is left-associative (`(a && b) && c`), so it wraps pairwise rather than putting every operand on its own line -- still an improvement over never wrapping, but not full all-or-nothing expansion for chains longer than two. See `test-projects/thor/lib/thor/command.rb:140` and `lib/thor/group.rb:189`. |
# | Array literal misindented inside a broken method chain | `Set.new([...]).freeze` when the chain breaks (`try_build_chain_doc`) and the array argument also expands: the array's elements, and its own `)`/`]`, don't land at a consistent fixed indent from the chain -- e.g. `VALID_UNSCOPING_VALUES = Set\n  .new(\n    [\n    :where,\n    ...\n  ]\n  )\n  .freeze`. Pre-existing (confirmed present before the `write_call_args`/`manages_own_indentation` fix below made more arrays reach the Doc-wrap path and thus surface it more often). See `test-projects/rails/source/activerecord/lib/active_record/relation/query_methods.rb:817`. |
#
# Fixed 2026-09-10: parenthesized calls/arrays/hashes with a hard-breaking
# argument (`if`/`case`/`begin`/`do...end`/`def`/…) now expand all-or-nothing
# instead of staying on the flat imperative path. Ternaries and modifier
# `if`/`unless` no longer count as hard-breaking, so an overlong call like
# `foo(cond ? a : b, lots, of, args)` reaches the Doc-wrap path. See
# `write_arg_list` / `write_expanded_bracketed_items` in format/mod.rs and
# `tests/fixtures/format/expanded_hard_break_args.rb`.
#
# Fixed 2026-09-05: method chains (`a.b.c.d`) now break -- see
# `try_build_chain_doc` in calls.rs. Also fixed the same day:
# `render_doc_to_string`'s width used to ignore content a
# caller knew would be appended right after the Doc rendered (a call's
# `do |params|` block header, a lambda's), so e.g.
# `Tempfile.open(long, args) do |temp|` didn't wrap its arg list even
# though the full line overflowed. Fixed via `Formatter::trailing_reserve`
# (set by `do_end_header_width`, consulted by `render_doc_to_string`) --
# see `test-projects/thor/lib/thor/shell/basic.rb:367` and
# `tests/fixtures/format/blocks.rb`'s `Tempfile.open` case.

# --- 1. All-or-nothing expansion: no bin-packing ---
Layout/FirstArrayElementLineBreak:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true
Layout/FirstMethodArgumentLineBreak:
  Enabled: true
Layout/MultilineArrayLineBreaks:
  Enabled: true
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

# --- 2. Block indentation: bracket on its own line, fixed indent ---
Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent
Layout/FirstArgumentIndentation:
  EnforcedStyle: consistent
Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation
Layout/MultilineArrayBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineHashBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineMethodCallBraceLayout:
  EnforcedStyle: new_line
Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

# --- Carried over from format-compare.rubocop.yml ---
# Tuxedo does not preserve hand-aligned columns yet; it always collapses
# runs of spaces to one. Leaving AllowForAlignment on would report every
# hand-aligned block as an offense against a feature Tuxedo has not
# implemented. Remove these once alignment preservation lands.
Layout/ExtraSpacing:
  AllowForAlignment: false
Layout/SpaceAroundOperators:
  AllowForAlignment: false
Layout/SpaceBeforeFirstArg:
  AllowForAlignment: false
