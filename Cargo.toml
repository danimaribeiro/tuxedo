[package]
name = "tuxedo"
version = "0.1.0"
edition = "2024"
description = "A fast Ruby code formatter and linter, written in Rust."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/danimaribeiro/tuxedo"
repository = "https://github.com/danimaribeiro/tuxedo"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
ruby-prism = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
insta = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
