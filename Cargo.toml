[package]
name = "tuxedo"
version = "0.1.0"
edition = "2024"
description = "A fast Ruby code formatter, written in Rust."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/danimaribeiro/tuxedo"
repository = "https://github.com/danimaribeiro/tuxedo"
# "tuxedo" is already taken on crates.io by an unrelated crate; distribute
# via the tuxedo-r gem (ruby/) instead.
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
pretty = "0.12.5"
ruby-prism = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }
toml = "1.1.4"
unicode-width = "0.2"

[dev-dependencies]
insta = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
