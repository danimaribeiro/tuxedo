[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Namespace git tags so dist's release workflow doesn't collide with the
# hand-written tuxedo-r gem release workflow (which triggers on plain "v*"
# tags). This also causes dist to generate `.github/workflows/dist-release.yml`
# instead of clobbering the existing `release.yml`.
tag-namespace = "dist"
